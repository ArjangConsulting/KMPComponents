org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Maven Central POM metadata shared by every published module, read by com.vanniktech.maven.publish.
# Each published module's gradle.properties sets POM_NAME and POM_DESCRIPTION. The version is
# injected as VERSION_NAME by release.yml.
POM_INCEPTION_YEAR=2026
POM_URL=https://github.com/ArjangConsulting/KMPComponents
POM_LICENSE_NAME=MIT License
POM_LICENSE_URL=https://opensource.org/licenses/MIT
POM_SCM_URL=https://github.com/ArjangConsulting/KMPComponents
POM_SCM_CONNECTION=scm:git:git://github.com/ArjangConsulting/KMPComponents.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/ArjangConsulting/KMPComponents.git
POM_DEVELOPER_ID=maniramezan
POM_DEVELOPER_NAME=Mani Ramezan
SONATYPE_HOST=CENTRAL_PORTAL
# Pass -PRELEASE_SIGNING_ENABLED=false to publish unsigned to mavenLocal.
RELEASE_SIGNING_ENABLED=true
