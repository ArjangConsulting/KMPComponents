# Generate the Xcode project with `xcodegen generate --spec sample/ios/project.yml`; the generated
# project is not checked in. A pre-build phase builds the shared catalog framework with Gradle.
name: KmpComponentsSample
options:
  bundleIdPrefix: io.github.maniramezan
  deploymentTarget:
    iOS: "17.0"
targets:
  KmpComponentsSample:
    type: application
    platform: iOS
    sources: [App.swift, Assets.xcassets]
    preBuildScripts:
      - name: Build Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../.."
          ./gradlew :sample:embedAndSignAppleFrameworkForXcode
    info:
      path: Info.plist
      properties:
        CADisableMinimumFrameDurationOnPhone: true
        CFBundleDisplayName: KMPComponents
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: io.github.maniramezan.kmpcomponents.sample
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # The library ships iosArm64 and iosSimulatorArm64 only (Apple Silicon simulators).
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/../build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: $(inherited) -framework CatalogKit
