version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
      compose:
        patterns:
          - "org.jetbrains.compose*"
      android:
        patterns:
          - "com.android*"
      maven-publish:
        patterns:
          - "com.vanniktech*"
      kommon:
        patterns:
          - "io.github.maniramezan.kommon*"
      androidx:
        patterns:
          - "androidx*"
      build-tooling:
        patterns:
          - "org.jetbrains.dokka*"
          - "org.jetbrains.kotlinx.kover*"
          - "org.jlleitschuh*"
          - "io.github.takahirom.roborazzi*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
