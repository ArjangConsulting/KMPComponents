name: Docs

# Publishes the API docs of a released tag to GitHub Pages, so the hosted reference matches what is
# on Maven Central. Release Please calls it after a release is published; run it by hand to
# republish a tag. Requires Settings > Pages > Source: GitHub Actions.
on:
  workflow_call:
    inputs:
      tag:
        description: Released bare SemVer tag to document
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Released bare SemVer tag to document
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: macos-26
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6

      - name: Build API docs
        env:
          ORG_GRADLE_PROJECT_VERSION_NAME: ${{ inputs.tag }}
        run: ./gradlew :dokkaGenerate

      - name: Include agent discovery index
        run: cp llms.txt build/dokka/html/llms.txt

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/dokka/html

      - id: deployment
        uses: actions/deploy-pages@v5
