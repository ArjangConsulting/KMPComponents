name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Release Please dispatches CI on its release branch, and Dependabot auto-merge dispatches it on
  # main, because pushes and merges made with GITHUB_TOKEN do not trigger workflows.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Keep in sync with release.yml so CI verifies exactly what gets published.
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      # The Kotlin/Native toolchain depends only on the Kotlin version, so other dependency bumps reuse
      # the cache. A Kotlin bump restores the previous toolchain's shared downloads through restore-keys.
      - name: Read the Kotlin version
        id: kotlin
        run: echo "version=$(sed -n 's/^kotlin = "\(.*\)"$/\1/p' gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"

      - name: Cache Kotlin Native toolchains and downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.konan/dependencies
            ~/.konan/kotlin-native-*
          key: ${{ runner.os }}-${{ runner.arch }}-konan-v2-${{ steps.kotlin.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-konan-v2-

      - name: Check consumer agent catalog
        run: python3 scripts/update_agent_catalog.py --check

      - name: Test repository scripts
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Lint
        run: ./gradlew ktlintCheck :components:lint :components-image:lint :sample-android:lintDebug

      # Use the wrapper so CI builds with the pinned Gradle version rather than the runner's.
      # verifyRoborazziJvm runs the desktop tests with screenshot comparison against the goldens.
      - name: Test and check the public API
        run: >-
          ./gradlew :components:allTests :components:verifyRoborazziJvm :components:checkKotlinAbi
          :components:koverXmlReport :components:koverLog :components:koverVerify
          :components-image:allTests :components-image:checkKotlinAbi :components-image:koverVerify :sample:jvmTest

      - name: Build library, API docs, and samples
        run: >-
          ./gradlew :components:assemble :components-image:assemble :dokkaGenerate :sample:compileKotlinJvm
          :sample-android:assembleDebug :sample:linkDebugFrameworkIosSimulatorArm64 :sample:wasmJsBrowserDistribution

      # A restore-keys hit can bring back an older toolchain; drop it so the saved cache stays one version.
      - name: Remove older Kotlin Native toolchains
        env:
          KOTLIN_VERSION: ${{ steps.kotlin.outputs.version }}
        run: find ~/.konan -maxdepth 1 -name 'kotlin-native-*' ! -name "*-$KOTLIN_VERSION" -exec rm -rf {} +

      # Test, lint, and Kover reports, and Roborazzi diff images when a screenshot changes.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: |
            components/build/reports/**
            components/build/outputs/roborazzi/**
            components-image/build/reports/**
            sample/build/reports/**
            sample-android/build/reports/**
