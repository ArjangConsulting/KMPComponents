name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Keep in sync with release.yml so CI verifies exactly what gets published.
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6

      - name: Check consumer agent catalog
        run: python3 scripts/update_agent_catalog.py --check

      - name: Lint
        run: ./gradlew ktlintCheck

      # Use the wrapper so CI builds with the pinned Gradle version rather than the runner's.
      # verifyRoborazziJvm runs the desktop tests with screenshot comparison against the goldens.
      - name: Test and check the public API
        run: >-
          ./gradlew :components:allTests :components:verifyRoborazziJvm :components:checkKotlinAbi
          :components:koverXmlReport :components:koverLog
          :components-image:allTests :components-image:checkKotlinAbi :sample:jvmTest

      - name: Build library, API docs, and samples
        run: >-
          ./gradlew :components:assemble :components-image:assemble :dokkaGenerate :sample:compileKotlinJvm
          :sample-android:assembleDebug :sample:linkDebugFrameworkIosSimulatorArm64

      - name: Include agent discovery index
        run: cp llms.txt build/dokka/html/llms.txt

      - name: Upload API docs for Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: build/dokka/html/
          if-no-files-found: error

      # Test reports, Kover coverage, and Roborazzi diff images when a screenshot changes.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: |
            components/build/reports/**
            components/build/outputs/roborazzi/**
            components-image/build/reports/**
            sample/build/reports/**
