name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: Bare SemVer tag to build and publish
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Bare SemVer tag to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-26
    environment: secrets
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6

      - name: Verify tag matches manifest version
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG_INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $TAG_INPUT must be bare SemVer."
            exit 1
          fi
          manifest_version="$(sed -nE 's/.*"\."[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/p' .release-please-manifest.json | tr -d '[:space:]')"
          if [ "$TAG_INPUT" != "$manifest_version" ]; then
            echo "::error::Tag $TAG_INPUT does not match manifest version $manifest_version."
            exit 1
          fi

      - name: Check publishing secrets
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_IN_MEMORY_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          SIGNING_IN_MEMORY_KEY_PASSWORD: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: |
          missing=0
          for name in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD SIGNING_IN_MEMORY_KEY SIGNING_IN_MEMORY_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set in the secrets environment."
              missing=1
            fi
          done
          exit "$missing"

      - name: Check
        env:
          ORG_GRADLE_PROJECT_VERSION_NAME: ${{ inputs.tag }}
        run: >-
          ./gradlew :components:allTests :components:checkKotlinAbi :components:assemble
          :components-image:allTests :components-image:checkKotlinAbi :components-image:assemble
          :sample:compileKotlinJvm --no-configuration-cache

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_VERSION_NAME: ${{ inputs.tag }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache

  create-github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          generate_release_notes: true

      # Stacked PRs reach main through merge commits, so Release Please can list a change twice.
      - name: Remove repeated release-note entries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          python3 scripts/dedupe_release_notes.py < notes.md > deduped.md
          if ! cmp -s notes.md deduped.md; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file deduped.md
          fi
